<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗺️ 我的城市探索地图（北京）</title>
<style>
  :root{
    --bg:#fdf6ec; --panel:#ffffff; --ink:#4a4036; --sub:#8a8175;
    --line:#efe6d8; --accent:#ff8a5b; --accent2:#5bbf9e; --blue:#4bb3e0;
    --shadow:0 4px 14px rgba(180,140,90,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:74px;position:relative;}
  header.top{background:linear-gradient(135deg,#ffb27a,#ff8a5b);color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 24px 24px;box-shadow:var(--shadow);}
  header.top h1{margin:0;font-size:20px;font-weight:800;}
  header.top p{margin:6px 0 0;font-size:13px;opacity:.95;}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .stat{flex:1;min-width:70px;background:rgba(255,255,255,.22);border-radius:14px;
    padding:8px 6px;text-align:center;}
  .stat b{display:block;font-size:18px;}
  .stat span{font-size:11px;opacity:.95;}
  .page{padding:16px;}
  .card{background:var(--panel);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);margin-bottom:14px;}
  .card h2{margin:0 0 10px;font-size:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:700;
    background:var(--accent);color:#fff;cursor:pointer;width:100%;margin-top:8px;
    transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.alt{background:var(--accent2);}
  .btn.blue{background:var(--blue);}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn.soft{background:#fff4ec;color:var(--accent);border:1.5px solid #ffd9c4;}
  .btn.sm{width:auto;padding:9px 12px;font-size:13px;border-radius:11px;margin-top:0;}
  .btn.mini{width:auto;padding:6px 10px;font-size:12px;border-radius:10px;margin-top:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .pill{display:inline-flex;align-items:center;gap:4px;background:#fff4ec;color:var(--accent);
    border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;margin:3px 4px 3px 0;
    cursor:pointer;border:1.5px solid transparent;}
  .pill.on{background:var(--accent);color:#fff;}
  .pill.sel{background:#fff;border:1.5px solid var(--accent);color:var(--accent);}
  label.fld{display:block;margin:10px 0 0;}
  label.fld span{font-size:13px;color:var(--sub);font-weight:600;}
  input,select,textarea{width:100%;margin-top:5px;padding:11px;border-radius:12px;
    border:1.5px solid var(--line);background:#fffdf9;font-size:14px;color:var(--ink);
    font-family:inherit;}
  textarea{resize:vertical;min-height:64px;}
  .loc-card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;
    padding:12px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;}
  .loc-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:24px;flex-shrink:0;}
  .loc-meta{flex:1;min-width:0;}
  .loc-meta h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;}
  .loc-meta p{margin:2px 0 0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
  .badge.vis{background:#e7f7ee;color:#2f9e6b;}
  .badge.wish{background:#ffe7ef;color:#e0558a;}
  .badge.demo{background:#fff3d6;color:#c08a2a;}
  .map-wrap{background:linear-gradient(135deg,#eaf6ff,#f3fbf3);border-radius:var(--radius);
    overflow:hidden;position:relative;box-shadow:var(--shadow);}
  .map-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2;}
  .map-tools button{width:34px;height:34px;border-radius:50%;border:none;background:#fff;
    box-shadow:var(--shadow);font-size:18px;cursor:pointer;color:var(--ink);}
  svg.map{display:block;width:100%;height:auto;touch-action:none;}
  .marker{cursor:pointer;}
  .marker circle{transition:r .1s;}
  .empty{text-align:center;color:var(--sub);padding:30px 16px;font-size:14px;}
  .empty .big{font-size:40px;margin-bottom:8px;}
  .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .bottom a{flex:1;text-align:center;padding:9px 2px 8px;font-size:11px;color:var(--sub);
    text-decoration:none;cursor:pointer;}
  .bottom a .ic{font-size:20px;display:block;}
  .bottom a.on{color:var(--accent);font-weight:800;}
  .back{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;
    padding:0;font-weight:700;margin-bottom:8px;}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(40,34,28,.92);
    color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:90;max-width:90%;
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .modal-mask{position:fixed;inset:0;background:rgba(40,34,28,.45);z-index:80;display:none;
    align-items:center;justify-content:center;padding:20px;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;
    box-shadow:var(--shadow);}
  .modal h3{margin:0 0 10px;font-size:16px;}
  .modal p{font-size:14px;color:var(--sub);margin:0 0 16px;}
  .modal .row{display:flex;gap:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .task{background:#fff;border-radius:14px;padding:13px;box-shadow:var(--shadow);margin-bottom:10px;
    display:flex;align-items:center;gap:10px;}
  .task .t-ic{font-size:22px;}
  .task .t-body{flex:1;}
  .task .t-body b{font-size:14px;}
  .task .t-body p{margin:2px 0 0;font-size:12px;color:var(--sub);}
  .ach{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:13px;
    box-shadow:var(--shadow);margin-bottom:10px;}
  .ach .a-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:26px;background:#f1ece3;}
  .ach.on .a-ic{background:#fff3d6;}
  .ach.lock{opacity:.6;}
  .ach .a-body{flex:1;}
  .ach .a-body b{font-size:14px;}
  .ach .a-body p{margin:2px 0 0;font-size:12px;color:var(--sub);}
  .sub{font-size:12px;color:var(--sub);}
  .row-flex{display:flex;gap:8px;flex-wrap:wrap;}
  .q-title{font-size:15px;font-weight:800;margin:6px 0 8px;}
  .photo{width:100%;border-radius:12px;margin-top:6px;}
  .tag{display:inline-block;background:#f1ece3;border-radius:8px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0;color:var(--sub);}
  .hr{height:1px;background:var(--line);margin:12px 0;border:none;}
  .mini-stats{display:flex;gap:8px;flex-wrap:wrap;}
  .mini-stats .ms{flex:1;min-width:90px;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow);}
  .mini-stats .ms b{font-size:18px;color:var(--accent);}
  .mini-stats .ms span{font-size:11px;color:var(--sub);}
  .catstat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .catstat:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="row">
      <button class="btn ghost sm" id="modalCancel">取消</button>
      <button class="btn sm" id="modalOk">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 基础配置 ============ */
const CATEGORIES=[
 {key:'park',emoji:'🌳',name:'公园绿地',color:'#7cc36b'},
 {key:'animal',emoji:'🦁',name:'动物世界',color:'#f0a84b'},
 {key:'science',emoji:'🔬',name:'科学探索',color:'#4bb3e0'},
 {key:'library',emoji:'📚',name:'图书馆',color:'#9b7bd6'},
 {key:'museum',emoji:'🏛️',name:'博物馆',color:'#d6708b'},
 {key:'culture',emoji:'🎨',name:'文化体验',color:'#e08b4b'},
 {key:'walk',emoji:'🚶',name:'城市漫步',color:'#5bbf9e'},
 {key:'rain',emoji:'☔',name:'雨天室内活动',color:'#6c9bd6'},
 {key:'nature',emoji:'🏕️',name:'自然教育',color:'#8bbf5b'},
 {key:'play',emoji:'🎡',name:'游乐体验',color:'#e0708c'},
];
const CATMAP={}; CATEGORIES.forEach(c=>CATMAP[c.key]=c);
const STORE_KEY='city_explore_map_v1';

/* 周末选择 → 分类映射 */
const MOODS=[
 {key:'outdoor',emoji:'🌳',label:'想在户外跑一跑',cats:['park','nature','walk']},
 {key:'animal',emoji:'🦁',label:'想认识动物',cats:['animal']},
 {key:'brain',emoji:'🔬',label:'想动脑筋',cats:['science']},
 {key:'read',emoji:'📚',label:'想安静阅读',cats:['library']},
 {key:'culture',emoji:'🏛️',label:'想了解历史文化',cats:['museum','culture','walk']},
 {key:'fresh',emoji:'🎨',label:'想体验新鲜事物',cats:['culture','play','museum']},
 {key:'rain',emoji:'☔',label:'下雨了，想在室内玩',cats:['rain']},
];

/* 探索任务模板（本地预置，无需AI） */
const TASK_TPL={
 park:[
   ['寻找两片形状不同的树叶','低头看看地面，捡起两片叶子比一比形状'],
   ['听一听周围有几种声音','闭上眼睛，数数能听到几种声音'],
   ['找一找不同颜色的花','在草地上找出红、黄、紫三种颜色的花'],
   ['观察天空中的云','抬头看看云，它像什么小动物？'],
 ],
 animal:[
   ['观察一种动物怎么走路','选一种动物，看它是走、跳还是爬'],
   ['寻找动物喜欢吃的食物','它吃什么？在说明牌上找答案'],
   ['看看它生活的环境','它的家是水池、笼子还是草地？'],
 ],
 science:[
   ['找到一个最让你好奇的展品','哪个装置让你最想问“为什么”'],
   ['观察一个互动装置','动手试一试，看看会发生什么'],
   ['想一想它为什么这样运作','把你的猜想说给爸爸妈妈听'],
 ],
 library:[
   ['找一本封面有趣的书','去书架挑一本你第一眼喜欢的书'],
   ['选一个最喜欢的故事','读一读，选出你最爱的那一个'],
   ['找一个自己不认识的新词','圈出一个不认识的字，回家查一查'],
 ],
 museum:[
   ['寻找一件特别的展品','哪一件最让你惊讶？'],
   ['看看以前的人使用什么工具','和现在的工具有什么不一样？'],
   ['选一个最想了解的东西','把它记在心里，回家查资料'],
 ],
 culture:[
   ['找一处特别的建筑细节','抬头看房檐、窗花或颜色'],
   ['发现一种有趣的颜色或图案','拍下来或画下来'],
   ['说说自己最喜欢的地方','为什么喜欢这里？'],
 ],
 walk:[
   ['观察一种街道标志','认一认路牌、红绿灯或店招'],
   ['找找建筑上的特别图案','砖墙、雕塑或壁画里藏了什么？'],
   ['发现一个之前没注意的地方','这条街有什么新发现？'],
 ],
 rain:[
   ['在室内找一个有趣的角度','从不同位置看看同一个展品'],
   ['发现一种新颜色或形状','数数场馆里有多少种蓝色'],
   ['说说今天最开心的事','用一句话记录下来'],
 ],
 nature:[
   ['认识一种树木或植物','摸一摸叶子，闻一闻气味'],
   ['找一种小昆虫','不要打扰它，远远地观察'],
   ['收集一种自然素材','一片石头、一根羽毛（若允许）'],
 ],
 play:[
   ['挑战一个项目','选一个最想玩的游戏'],
   ['数一数玩了几个项目','用画笔或照片记下来'],
   ['给今天打分','1到5颗星，你打几颗？'],
 ],
};
const GENERIC_TASKS=[
 ['仔细观察一样东西','选一样东西，看看它有什么细节'],
 ['画下今天的发现','用纸笔画一画你看到的有趣事物'],
 ['说一个今天学到的新词','把新词记在心里带回家'],
];

/* ============ 状态与持久化 ============ */
let state=null;
let view='home'; let viewParam=null;
let mapScale=1, mapMode='map';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function demoLocations(){
  const base=[
    ['北海公园','西城区','公园绿地,城市漫步','户外','1—2小时','免费（园中园另购票）','无需预约','自然观察、划船、古建','春秋季','湖边注意安全','park,walk'],
    ['北京动物园','西城区','动物世界','户外','半天','旺季¥15/淡季¥10','旺季建议预约','动物观察、喂食展示','天气好时','人多处看护好孩子','animal'],
    ['中国科学技术馆','朝阳区','科学探索','室内','半天','主展厅¥30','需预约','科学实验、互动装置','工作日人少','儿童需由成人陪同','science'],
    ['国家图书馆（少儿馆）','海淀区','图书馆','室内','1—2小时','免费','无需预约','绘本阅读、故事会','周末上午','保持安静','library'],
    ['故宫博物院','东城区','博物馆,城市漫步','户外','半天','¥60（旺季）','需提前预约','古建筑、历史故事','避开酷暑严寒','步行量大，穿舒适鞋','museum,walk'],
    ['北京自然博物馆','东城区','动物世界,科学探索','室内','2—3小时','免费（需预约）','需预约','恐龙、化石、生物演化','工作日','热门票源紧张','animal,science'],
    ['中国美术馆','东城区','文化体验','室内','1—2小时','免费','需预约','绘画、雕塑欣赏','展览期间','馆内勿饮食','culture'],
    ['中国儿童中心','西城区','文化体验,雨天室内活动','室内','2—3小时','部分活动收费','按活动预约','手工、亲子活动','周末','关注具体课程安排','culture,rain'],
    ['北京欢乐谷','朝阳区','游乐体验','户外','一整天','¥260左右','无需预约','游乐设施、表演','天气好时','注意身高限制','play'],
    ['奥林匹克森林公园','朝阳区','公园绿地,自然教育','户外','2—3小时','免费','无需预约','跑步、观鸟、自然认知','清晨或傍晚','园区较大，注意补水','park,nature'],
  ];
  return base.map((b,i)=>({
    id:uid(), name:b[0], city:'北京', area:b[1], address:'（演示地址，请替换为真实位置）',
    cats:b[10].split(','), indoor:b[3], duration:b[4], cost:b[5], needBooking:b[6],
    theme:b[7], bestTime:b[8], notes:b[9], ageRange:'3—10岁',
    demo:true, visited:false, createdAt:Date.now(),
    pos:posFor(i)
  }));
}
function posFor(i){
  // 在示意地图范围内散布，固定坐标（非真实比例）
  const xs=[90,300,500,160,420,250,560,110,360,470];
  const ys=[90,230,140,300,260,120,320,200,330,90];
  return {x:xs[i%xs.length], y:ys[i%ys.length]};
}

function defaultState(){
  return {
    locations:demoLocations(),
    wishlist:[],          // {locationId, addedAt}
    explorations:[],      // 探索记录/日记
    plans:[],             // 周末计划
    settings:{city:'北京'},
  };
}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){ state=defaultState(); save(); return; }
    const d=JSON.parse(raw);
    if(!d || !Array.isArray(d.locations)){ state=defaultState(); save(); return; }
    state=d;
    if(!state.settings) state.settings={city:'北京'};
    if(!Array.isArray(state.wishlist)) state.wishlist=[];
    if(!Array.isArray(state.explorations)) state.explorations=[];
    if(!Array.isArray(state.plans)) state.plans=[];
  }catch(e){
    toast('读取本地数据失败，已重置为演示数据');
    state=defaultState(); save();
  }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    toast('⚠️ 本地存储空间不足，部分数据（如照片）可能未保存');
  }
}

/* ============ 工具函数 ============ */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function confirmModal(title,text){
  return new Promise(res=>{
    const mask=document.getElementById('modalMask');
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalText').textContent=text;
    const ok=document.getElementById('modalOk'), cancel=document.getElementById('modalCancel');
    const done=(v)=>{ mask.classList.remove('show'); ok.onclick=null; cancel.onclick=null; res(v); };
    ok.onclick=()=>done(true); cancel.onclick=()=>done(false);
    mask.classList.add('show');
  });
}
function catMeta(key){ return CATMAP[key]||{emoji:'📍',name:key,color:'#bbb'}; }
function locById(id){ return state.locations.find(l=>l.id===id); }
function isWished(id){ return state.wishlist.some(w=>w.locationId===id); }
function catEmojis(cats){ return cats.map(c=>catMeta(c).emoji).join(''); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* 费用/预算模糊匹配 */
function matchBudget(loc,b){
  if(b==='any') return true;
  const c=(loc.cost||'');
  if(b==='free') return /免费|免票|不收|无票|0元|不收费/.test(c);
  if(b==='low') return !/贵|较高|¥\d{3,}|门票\d{3,}|元\d{3,}/.test(c);
  return true;
}

/* ============ 筛选 ============ */
function currentFilters(){
  // 从 state._filters 读取（地图/列表共用）
  return state._filters||{cat:'',area:'',q:'',indoor:'',visited:'',wish:false};
}
function applyFilters(list){
  const f=currentFilters();
  return list.filter(l=>{
    if(f.cat && !(l.cats||[]).includes(f.cat)) return false;
    if(f.area && l.area!==f.area) return false;
    if(f.q && !(l.name||'').toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.indoor==='indoor' && l.indoor!=='室内') return false;
    if(f.indoor==='outdoor' && l.indoor!=='户外') return false;
    if(f.visited==='yes' && !l.visited) return false;
    if(f.visited==='no' && l.visited) return false;
    if(f.wish && !isWished(l.id)) return false;
    return true;
  });
}
function areaOptions(){ return [...new Set(state.locations.map(l=>l.area).filter(Boolean))]; }

/* ============ 渲染 ============ */
const app=document.getElementById('app');
function render(){
  if(view==='home') return renderHome();
  if(view==='map') return renderMap();
  if(view==='weekend') return renderWeekend();
  if(view==='detail') return renderDetail(viewParam);
  if(view==='wishlist') return renderWishlist();

function weekendFilter(){
  const cats=weekend.mood?MOODS.find(m=>m.key===weekend.mood).cats:null;
  return state.locations.filter(l=>{
    if(cats && !(l.cats||[]).some(c=>cats.includes(c))) return false;
    if(weekend.indoor==='indoor' && l.indoor!=='室内') return false;
    if(weekend.indoor==='outdoor' && l.indoor!=='户外') return false;
    if(weekend.budget && !matchBudget(l,weekend.budget)) return false;
    if(weekend.area && weekend.area!=='全部区域' && l.area!==weekend.area) return false;
    return true;
  });
}

  const r=weekendFilter();
  const box=document.getElementById('wkResult');
  if(!r.length){ box.innerHTML=`<div class="empty"><div class="big">🔍</div>暂时没有符合这些条件的地点，<br>可以调整筛选条件，或添加更多探索地点。</div>`; return; }

function selMood(el){ document.querySelectorAll('#moodChips .pill').forEach(p=>p.classList.remove('on')); el.classList.add('on'); window._mood=el.dataset.mood; }
function onPhoto(input){
  const file=input.files[0]; if(!file)return;
  compressImage(file,(data,err)=>{
    if(err||!data){ toast('⚠️ 照片未能保存，请重试或跳过'); return; }
    window._photo=data;
    document.getElementById('f_photopreview').innerHTML=`<img class="photo" src="${data}">`;
    toast('照片已压缩，保存时写入');
  });
}
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onerror=()=>cb(null,new Error('read'));
  reader.onload=e=>{
    const img=new Image();
    img.onerror=()=>cb(null,new Error('img'));
    img.onload=()=>{
      let w=img.width,h=img.height; const max=900;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL('image/jpeg',0.6)); }catch(err){ cb(null,err); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function genPlan(){
  const type=document.getElementById('p_type').value;
  const indoor=document.getElementById('p_in').value;
  const budget=document.getElementById('p_budget').value;
  const count=Math.max(1,Math.min(6,parseInt(document.getElementById('p_count').value)||2));
  let pool=state.locations.filter(l=>{
    if(type && !(l.cats||[]).some(c=>CATMAP[c]&&CATMAP[c].name===type)) return false;
    if(indoor && l.indoor!==indoor) return false;
    if(budget && !matchBudget(l,budget)) return false;
    return true;
  });
  if(!pool.length){ document.getElementById('planResult').innerHTML=`<div class="empty"><div class="big">🗓️</div>没有符合条件的地点，调整一下再生成吧。</div>`; return; }
  pool=pool.sort(()=>Math.random()-0.5).slice(0,count);
  const dur=document.getElementById('p_dur').value;
  // 时间块（仅示例，不计算真实路程）
  const blocks={ '1—2小时':[['09:30','到达地点'],['10:00','开始探索任务'],['11:00','自由活动']],
    '半天':[['09:30','到达地点'],['10:00','探索任务'],['11:00','自由活动'],['11:30','分享新发现']],
    '一整天':[['09:30','到达地点'],['10:00','探索任务'],['11:30','午餐休息'],['13:30','第二个地点'],['15:00','自由活动'],['16:00','分享今天的新发现']] }[dur]||[];
  const plan={ id:uid(), date:document.getElementById('p_date').value, dur, type, indoor, budget,
    trans:document.getElementById('p_trans').value, locations:pool.map(l=>l.id), manualOrder:pool.map(l=>l.id), createdAt:Date.now() };
  state.plans.unshift(plan); save();
  const box=document.getElementById('planResult');
  box.innerHTML=`<div class="card">
    <h2>🗓️ ${esc(plan.date)} 探索计划</h2>
    <p class="sub">交通：${esc(plan.trans||'自行安排')} ｜ 地点顺序仅供参考，请根据真实交通情况调整。</p>
    ${pool.map((l,i)=>{
      const m=catMeta((l.cats||[])[0]||'park');
      return `<div class="loc-card" onclick="navigate('detail','${l.id}')">
        <div class="loc-ic" style="background:${m.color}22;">${m.emoji}</div>
        <div class="loc-meta"><h3>${i+1}. ${esc(l.name)}</h3><p>${m.name} · ${esc(l.area||'')}</p></div>
      </div>`;
    }).join('')}
    <div class="q-title" style="margin-top:10px;">⏰ 时间建议</div>
    ${blocks.map(b=>`<div class="catstat"><span>${b[0]}</span><b style="font-weight:600;">${b[1]}</b></div>`).join('')}
    <button class="btn ghost sm" onclick="delPlan('${plan.id}')">删除此计划</button>
  </div>`;
  toast('计划已生成并保存');
}

function exportData(){

  const a=document.createElement('a'); a.href=url; a.download='城市探索地图_'+new Date().toISOString().slice(0,10)+'.json';

function importData(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d || !Array.isArray(d.locations)) throw new Error('格式错误');
      if(!confirm('导入将覆盖当前数据，确定继续？')) { input.value=''; return; }
      state={ locations:d.locations||[], wishlist:d.wishlist||[], explorations:d.explorations||[], plans:d.plans||[],
        settings:d.settings||{city:'北京'} };
      save(); toast('✅ 导入成功'); input.value=''; navigate('home');
    }catch(err){ toast('⚠️ 导入失败：数据格式不正确，未改动现有数据'); input.value=''; }
  };
  reader.readAsText(file);
}

  const cats=[...document.querySelectorAll('#n_cats input:checked')].map(i=>i.value);
  const data={
    name, city:document.getElementById('n_city').value.trim()||'北京',
    area:document.getElementById('n_area').value.trim(),
    address:document.getElementById('n_addr').value.trim(),
    cats: cats.length?cats:['park'],
    ageRange:document.getElementById('n_age').value.trim(),
    indoor:document.getElementById('n_indoor').value,
    duration:document.getElementById('n_dur').value.trim(),
    cost:document.getElementById('n_cost').value.trim(),
    needBooking:document.getElementById('n_book').value.trim(),
    theme:document.getElementById('n_theme').value.trim(),
    bestTime:document.getElementById('n_best').value.trim(),
    notes:document.getElementById('n_notes').value.trim(),
    remark:document.getElementById('n_remark').value.trim(),
  };
  if(editId){
    const l=locById(editId); if(!l){ toast('地点不存在'); return; }
    Object.assign(l,data); l.demo=false; save(); toast('已保存修改'); navigate('detail',editId);
  }else{
    const l=Object.assign({id:uid(),demo:false,visited:false,createdAt:Date.now(),pos:posFor(state.locations.length)},data);
    state.locations.push(l); save(); toast('✅ 已添加地点'); navigate('detail',l.id);
  }
}

/* ============ 底部导航 ============ */
function bottomNav(){
  const items=[
    ['home','🏠','首页'],['map','🗺️','探索地图'],['diary','📖','探索日记'],
    ['wishlist','❤️','愿望清单'],['parent','👨‍👩‍👧','家长管理']
  ];
  return `<div class="bottom">${items.map(i=>`<a class="${view===i[0]?'on':''}" onclick="navigate('${i[0]}')"><span class="ic">${i[1]}</span>${i[2]}</a>`).join('')}</div>`;
}

/* ============ 启动 ============ */
function boot(){
  load();
  // 包装 navigate 以重绘底部导航
  const origRender=render;
  const appEl=document.getElementById('app');
  const obs=new MutationObserver(()=>{});
  // 每次渲染后追加底部导航
  const _render=render;
  window.__draw=function(){
    _render();
    const b=document.createElement('div'); b.innerHTML=bottomNav();
    appEl.appendChild(b.firstChild);
  };
  window.navigate=function(v,p){ view=v; viewParam=p||null; window.scrollTo(0,0); window.__draw(); };
  window.__draw();
  // 暴露所需函数到全局（onclick 用）
  ['zoomMap','toggleMapMode','setFilter','clearFilters','pickMood','pickIndoor','pickDur','pickBudget','weekendFind','weekendRandom','weekendReset','toggleWish','markVisited','delLocation','selMood','onPhoto','saveExploration','delDiary','doRandom','doneTask','nextTask','genPlan','delPlan','delAllDemo','exportData','importData','loadDemo','clearAll','saveLocation','renderCatChips'].forEach(fn=>{ if(typeof window[fn]==='undefined') window[fn]=eval(fn); });
}
boot();
</script>
